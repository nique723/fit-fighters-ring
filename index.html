<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fit Fighters</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0d10; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      #app, #game-root { width: 100%; height: 100%; }
      canvas { display: block; touch-action: none; }
      #touch-controls { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 20; }
      #touch-controls.visible { display: block; }
      .touch-cluster { position: absolute; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 12px; pointer-events: auto; }
      .touch-cluster.left { left: 16px; }
      .touch-cluster.right { right: 16px; flex-wrap: wrap; width: 280px; justify-content: flex-end; }
      .touch-btn { width: 84px; height: 84px; border: 2px solid rgba(255,255,255,.35); border-radius: 16px; background: rgba(12,16,22,.72); color: #f3f4f6; font: 700 13px/1.1 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
      .touch-btn.active { background: rgba(214,158,46,.85); border-color: #f6e05e; color: #1a202c; }
      #debug-overlay { display: none; position: fixed; top: 8px; left: 8px; z-index: 30; background: rgba(8,10,14,.82); color: #c6f6d5; font: 12px/1.45 ui-monospace, Menlo, monospace; padding: 10px 12px; border: 1px solid rgba(72,187,120,.35); border-radius: 6px; min-width: 240px; pointer-events: none; white-space: pre; }
      #debug-overlay.visible { display: block; }
      #hint { position: fixed; top: 10px; right: 12px; z-index: 25; color: rgba(237,242,247,.7); font: 600 11px/1.3 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
      #camera-toggle { position: fixed; top: 36px; right: 12px; z-index: 40; min-width: 108px; height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(12,16,22,.82); color: #edf2f7; font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
      #camera-toggle.on { background: rgba(214,158,46,.9); color: #1a202c; border-color: #f6e05e; }
      #camera-panel { display: none; position: fixed; left: 12px; bottom: 12px; z-index: 40; width: 240px; background: rgba(8,10,14,.88); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; overflow: hidden; }
      #camera-panel.open { display: block; }
      #camera-stage { position: relative; width: 240px; height: 180px; background: #000; }
      #camera-video, #camera-skel { position: absolute; inset: 0; width: 240px; height: 180px; }
      #camera-video { object-fit: cover; transform: scaleX(-1); }
      #camera-bar { display: flex; gap: 6px; padding: 8px; flex-wrap: wrap; }
      #camera-bar button { flex: 1; min-height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: #1a202c; color: #e2e8f0; font: 700 10px/1 system-ui, sans-serif; text-transform: uppercase; cursor: pointer; }
      #camera-status { padding: 0 8px 8px; color: #a0aec0; font: 600 11px/1.3 system-ui, sans-serif; }
      #camera-warn { display: none; margin: 0 8px 8px; padding: 6px 8px; background: #c53030; color: #fff; font: 700 11px/1.3 system-ui, sans-serif; border-radius: 6px; }
      #camera-warn.show { display: block; }
      #camera-cal { display: none; position: fixed; left: 50%; top: 18%; transform: translateX(-50%); z-index: 45; min-width: 280px; padding: 16px 18px; background: rgba(8,10,14,.92); border: 1px solid rgba(246,224,94,.45); border-radius: 12px; color: #f7fafc; font: 700 14px/1.4 system-ui, sans-serif; text-align: center; pointer-events: none; }
      #camera-cal.show { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="game-root"></div>
      <div id="hint">A/D move · J jab · K cross · L body · Space slip · ` debug</div>
      <button type="button" id="camera-toggle">Camera</button>
      <div id="camera-cal">Hold your guard. Don't bounce.</div>
      <aside id="camera-panel">
        <div id="camera-stage">
          <video id="camera-video" playsinline muted></video>
          <canvas id="camera-skel" width="240" height="180"></canvas>
        </div>
        <div id="camera-bar">
          <button type="button" id="camera-stance">Orthodox</button>
          <button type="button" id="camera-overlay">Overlay on</button>
          <button type="button" id="camera-close">Close</button>
        </div>
        <div id="camera-status">Camera off</div>
        <div id="camera-warn"></div>
      </aside>
      <pre id="debug-overlay"></pre>
      <div id="touch-controls">
        <div class="touch-cluster left">
          <button type="button" class="touch-btn" data-action="left">Left</button>
          <button type="button" class="touch-btn" data-action="right">Right</button>
        </div>
        <div class="touch-cluster right">
          <button type="button" class="touch-btn" data-action="jab">Jab</button>
          <button type="button" class="touch-btn" data-action="cross">Cross</button>
          <button type="button" class="touch-btn" data-action="body">Body</button>
          <button type="button" class="touch-btn" data-action="slip">Slip</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
