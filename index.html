<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fit Fighters — Fight Night '96</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
      #app { height: 100%; display: flex; align-items: center; justify-content: center; }
      #stage {
        position: relative;
        background: #07090c;
        overflow: hidden;
        flex: 0 0 auto;
      }
      #game-root, #game-root canvas { width: 100% !important; height: 100% !important; display: block; touch-action: none; }
      #touch-controls { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 20; }
      #touch-controls.visible { display: block; }
      .touch-cluster { position: absolute; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; pointer-events: auto; }
      .touch-cluster.left { left: calc(10px + env(safe-area-inset-left)); }
      .touch-cluster.right { right: calc(10px + env(safe-area-inset-right)); width: 46%; justify-content: flex-end; flex-wrap: wrap; }
      .touch-btn {
        width: clamp(54px, 9vw, 86px);
        height: clamp(48px, 8vw, 80px);
        border: 2px solid rgba(255,255,255,.35);
        border-radius: 14px;
        background: rgba(12,16,22,.55);
        color: #f3f4f6;
        font: 700 12px/1.1 system-ui, sans-serif;
        letter-spacing: .04em;
        text-transform: uppercase;
        display: flex; align-items: center; justify-content: center;
      }
      .dpad { display: grid !important; grid-template-columns: repeat(3, clamp(42px, 7vw, 66px)); grid-template-rows: repeat(3, clamp(36px, 5.6vw, 54px)); gap: 4px; }
      .dpad .touch-btn { width: 100%; height: 100%; font-size: 18px; }
      .dpad .up { grid-column: 2; grid-row: 1; } .dpad .lt { grid-column: 1; grid-row: 2; }
      .dpad .rt { grid-column: 3; grid-row: 2; } .dpad .dn { grid-column: 2; grid-row: 3; }
      /* 90s broadcast: faint scanlines over the whole stage */
      #crt { position: absolute; inset: 0; z-index: 15; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.10) 2px 3px); mix-blend-mode: multiply; }
      .touch-btn.active { background: rgba(214,158,46,.85); border-color: #f6e05e; color: #1a202c; }
      #debug-overlay { display: none; position: absolute; top: 8px; left: 8px; z-index: 30; background: rgba(8,10,14,.82); color: #c6f6d5; font: 11px/1.4 ui-monospace, Menlo, monospace; padding: 8px 10px; border-radius: 6px; pointer-events: none; white-space: pre; }
      #debug-overlay.visible { display: block; }
      #hint { position: absolute; bottom: 12px; left: 12px; max-width: 34%; z-index: 25; color: rgba(237,242,247,.65); font: 600 11px/1.3 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; }
      @media (pointer: coarse) { #hint { display: none; } }
      @media (max-height: 500px) {
        #fight-toggle { height: 46px; min-width: 130px; font-size: 17px; bottom: 10px; box-shadow: 0 5px 0 #b7791f; }
        #fight-toggle.stop { box-shadow: 0 5px 0 #9b2c2c; }
        .touch-cluster.right { width: 40%; }
        .touch-btn { background: rgba(12,16,22,.38); }
      }
      #fight-toggle { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; min-width: 180px; height: 64px; padding: 0 28px; border-radius: 16px; border: 3px solid #fff; background: #f6e05e; color: #1a202c; font: 900 22px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 8px 0 #b7791f; }
      #fight-toggle.stop { background: #e53e3e; color: #fff; box-shadow: 0 8px 0 #9b2c2c; }
      #sound-test { position: absolute; top: 8px; left: 10px; z-index: 40; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(12,16,22,.82); color: #edf2f7; font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      #fighter-pick { position: absolute; top: 8px; left: 96px; z-index: 40; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(12,16,22,.82); color: #edf2f7; font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      #fighter-card { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); z-index: 45; width: 240px; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,.18); background: rgba(8,10,14,.86); color: #edf2f7; font: 600 11px/1.2 system-ui, sans-serif; pointer-events: none; }
      #fighter-card.hidden { display: none; }
      /* fighter select */
      #select { display: none; position: absolute; inset: 0; z-index: 80; background: radial-gradient(ellipse at 50% 30%, rgba(30,24,10,.94), rgba(5,6,10,.97) 70%); color: #edf2f7; font: 600 12px/1.2 system-ui, sans-serif; overflow-y: auto; }
      #select.open { display: flex; align-items: flex-start; justify-content: center; }
      .sl-box { width: min(760px, 100% - 32px); padding: 18px 0 20px; display: flex; flex-direction: column; gap: 12px; }
      .sl-head { text-align: center; font: 900 26px/1 Impact, system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #f6e05e; }
      .sl-slots { display: flex; align-items: center; justify-content: center; gap: 10px; }
      .sl-vs { font: 900 16px Impact, system-ui, sans-serif; color: #a0aec0; text-transform: uppercase; }
      .sl-slot { flex: 0 1 220px; padding: 7px 12px; border-radius: 10px; border: 2px solid rgba(255,255,255,.18); background: rgba(12,16,22,.85); color: #edf2f7; text-align: left; }
      .sl-slot span { display: block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: #a0aec0; }
      .sl-slot b { font: 900 17px/1.1 Impact, system-ui, sans-serif; letter-spacing: .05em; }
      .sl-slot.player.active { border-color: #f6e05e; } .sl-slot.opponent.active { border-color: #fc8181; }
      .sl-grid { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 6px; scroll-snap-type: x mandatory; }
      .sl-card { position: relative; flex: 0 0 132px; scroll-snap-align: start; padding: 0 0 8px; border-radius: 12px; border: 2px solid rgba(255,255,255,.14); background: rgba(16,20,28,.9); color: #edf2f7; overflow: hidden; text-align: center; }
      .sl-card.you { border-color: #f6e05e; } .sl-card.opp { border-color: #fc8181; }
      .sl-pic { --ph: 128px; position: relative; height: var(--ph); background: #1a202c; overflow: hidden; }
      .sl-pic img { position: absolute; width: auto; max-width: none; }
      .sl-card b { display: block; margin-top: 6px; font: 900 15px/1 Impact, system-ui, sans-serif; letter-spacing: .05em; }
      .sl-card small { display: block; margin: 3px 6px 0; font-size: 9px; color: #a0aec0; text-transform: uppercase; letter-spacing: .04em; min-height: 22px; }
      .sl-card i { position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 6px; font: 800 9px/1.2 system-ui, sans-serif; font-style: normal; background: #f6e05e; color: #1a202c; }
      .sl-card.opp i { background: #fc8181; }
      .sl-compare { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: rgba(8,10,14,.7); border: 1px solid rgba(255,255,255,.1); }
      .sl-row { display: grid; grid-template-columns: 18px 1fr 92px 1fr 18px; align-items: center; gap: 8px; }
      .sl-row span { text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #cbd5e0; }
      .sl-row em { font-style: normal; text-align: center; color: #a0aec0; } .sl-row em.up { color: #fff; font-weight: 900; }
      .sl-row i { height: 7px; border-radius: 4px; background: #2d3748; overflow: hidden; display: flex; }
      .sl-row i.l { justify-content: flex-end; } .sl-row i.l b { background: #f6e05e; } .sl-row i.r b { background: #fc8181; }
      .sl-row b { display: block; height: 100%; }
      .sl-go { align-self: center; min-width: 220px; height: 52px; border-radius: 14px; border: 3px solid #fff; background: #f6e05e; color: #1a202c; font: 900 18px/1 system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; box-shadow: 0 6px 0 #b7791f; }
      .sl-go:disabled { opacity: .7; }
      @media (max-height: 500px) {
        .sl-box { padding: 8px 0 10px; gap: 7px; }
        .sl-head { font-size: 18px; }
        .sl-slot { padding: 4px 10px; } .sl-slot b { font-size: 14px; }
        .sl-card { flex-basis: 104px; } .sl-pic { --ph: 84px; } .sl-card small { display: none; }
        .sl-compare { padding: 6px 10px; gap: 2px; grid-template-columns: 1fr 1fr; column-gap: 18px; }
        .sl-go { height: 40px; font-size: 15px; }
      }
      #fighter-card .fc-name { font: 900 18px/1 Impact, system-ui, sans-serif; letter-spacing: .06em; color: #f6e05e; }
      #fighter-card .fc-trait { margin: 3px 0 8px; color: #cbd5e0; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
      #fighter-card .fc-row { display: grid; grid-template-columns: 76px 1fr 18px; align-items: center; gap: 6px; margin: 3px 0; }
      #fighter-card .fc-row i { height: 6px; border-radius: 3px; background: #2d3748; overflow: hidden; }
      #fighter-card .fc-row b { display: block; height: 100%; background: #f6e05e; }
      #fighter-card .fc-row em { font-style: normal; text-align: right; color: #fff; }
      #fighter-card .fc-vs { margin-top: 7px; color: #a0aec0; text-transform: uppercase; letter-spacing: .08em; font-size: 10px; }
      @media (max-height: 500px) { #fighter-card { bottom: 96px; transform: translateX(-50%) scale(.85); transform-origin: bottom center; } }
      #sound-test.on { background: #276749; border-color: #68d391; }
      #full-toggle { position: absolute; top: 8px; right: 96px; z-index: 40; width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(12,16,22,.82); color: #edf2f7; font: 700 16px/1 system-ui, sans-serif; }
      #camera-toggle { position: absolute; top: 8px; right: 10px; z-index: 40; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.28); background: rgba(12,16,22,.82); color: #edf2f7; font: 700 11px/1 system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      #camera-toggle.on { background: rgba(214,158,46,.9); color: #1a202c; border-color: #f6e05e; }
      #camera-panel { display: none; position: absolute; left: 10px; top: 44px; z-index: 40; width: min(220px, 42%); background: rgba(8,10,14,.88); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; overflow: hidden; }
      #camera-panel.open { display: block; }
      #camera-stage { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; }
      #camera-video, #camera-skel { position: absolute; inset: 0; width: 100%; height: 100%; }
      #camera-video { object-fit: cover; transform: scaleX(-1); }
      #camera-bar { display: flex; gap: 6px; padding: 8px; }
      #camera-bar button { flex: 1; min-height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,.2); background: #1a202c; color: #e2e8f0; font: 700 10px/1 system-ui, sans-serif; text-transform: uppercase; }
      #camera-status { padding: 0 8px 8px; color: #a0aec0; font: 600 11px/1.3 system-ui, sans-serif; }
      #camera-warn { display: none; margin: 0 8px 8px; padding: 6px 8px; background: #c53030; color: #fff; font: 700 11px/1.3 system-ui, sans-serif; border-radius: 6px; }
      #camera-warn.show { display: block; }
      #camera-cal { display: none; position: absolute; left: 50%; top: 16%; transform: translateX(-50%); z-index: 45; width: min(280px, 80%); padding: 14px; background: rgba(8,10,14,.92); border: 1px solid rgba(246,224,94,.45); border-radius: 12px; color: #f7fafc; font: 700 14px/1.4 system-ui, sans-serif; text-align: center; pointer-events: none; }
      #camera-cal.show { display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <div id="game-root"></div>
        <div id="hint">WASD / arrows move · J jab · K cross · H hook · L body · U upper · Space slip · I duck · ` debug</div>
        <div id="crt"></div>
        <button type="button" id="fight-toggle">Start</button>
        <button type="button" id="sound-test">Sound</button>
        <button type="button" id="fighter-pick">Fighters</button>
        <div id="fighter-card"></div>
        <div id="select" aria-label="Fighter select"></div>
        <button type="button" id="full-toggle" aria-label="Full screen">⛶</button>
        <button type="button" id="camera-toggle">Camera</button>
        <div id="camera-cal">Hold your guard. Don't bounce.</div>
        <aside id="camera-panel">
          <div id="camera-stage">
            <video id="camera-video" playsinline muted></video>
            <canvas id="camera-skel" width="240" height="180"></canvas>
          </div>
          <div id="camera-bar">
            <button type="button" id="camera-stance">Orthodox</button>
            <button type="button" id="camera-overlay">Overlay on</button>
            <button type="button" id="camera-close">Close</button>
          </div>
          <div id="camera-status">Camera off</div>
          <div id="camera-warn"></div>
        </aside>
        <pre id="debug-overlay"></pre>
        <div id="touch-controls">
          <div class="touch-cluster left dpad">
            <button type="button" class="touch-btn up" data-action="up" aria-label="Move in">▲</button>
            <button type="button" class="touch-btn lt" data-action="left" aria-label="Move left">◀</button>
            <button type="button" class="touch-btn rt" data-action="right" aria-label="Move right">▶</button>
            <button type="button" class="touch-btn dn" data-action="down" aria-label="Move out">▼</button>
          </div>
          <div class="touch-cluster right">
            <button type="button" class="touch-btn" data-action="jab">Jab</button>
            <button type="button" class="touch-btn" data-action="cross">Cross</button>
            <button type="button" class="touch-btn" data-action="hook">Hook</button>
            <button type="button" class="touch-btn" data-action="body">Body</button>
            <button type="button" class="touch-btn" data-action="upper">Upper</button>
            <button type="button" class="touch-btn" data-action="slip">Slip</button>
            <button type="button" class="touch-btn" data-action="duck">Duck</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      function fitStage() {
        const stage = document.getElementById('stage');
        stage.style.width = window.innerWidth + 'px';
        stage.style.height = window.innerHeight + 'px';
      }
      fitStage();
      window.addEventListener('resize', fitStage);
      window.addEventListener('orientationchange', () => setTimeout(fitStage, 80));
      const fullBtn = document.getElementById('full-toggle');
      function syncFull() {
        const on = document.fullscreenElement || document.webkitFullscreenElement;
        fullBtn.textContent = on ? '×' : '⛶';
        fullBtn.setAttribute('aria-label', on ? 'Exit full screen' : 'Full screen');
      }
      fullBtn.addEventListener('click', () => {
        const on = document.fullscreenElement || document.webkitFullscreenElement;
        if (on) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
          return;
        }
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) req.call(el);
      });
      document.addEventListener('fullscreenchange', syncFull);
      document.addEventListener('webkitfullscreenchange', syncFull);
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
