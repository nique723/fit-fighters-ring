<!doctype html><html><head><style>
@font-face{font-family:G;src:url(Graduate.ttf)}
html,body{margin:0;background:transparent}
svg{display:block}
text{font-family:G;text-anchor:middle}
</style></head><body>
<svg id="e" width="1200" height="1200" viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#fff1b8"/><stop offset=".35" stop-color="#e2b04a"/><stop offset=".6" stop-color="#9c6b1c"/><stop offset="1" stop-color="#f3cf6e"/></linearGradient>
 <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#f7dc8a"/><stop offset=".5" stop-color="#a8761f"/><stop offset="1" stop-color="#f0c95f"/></linearGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e4e7ea"/><stop offset=".55" stop-color="#9da3aa"/><stop offset="1" stop-color="#f2f4f6"/></linearGradient>
 <radialGradient id="bg" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#2a0c0d"/><stop offset=".7" stop-color="#0d0b0c"/><stop offset="1" stop-color="#050505"/></radialGradient>
 <radialGradient id="red" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ff5148"/><stop offset=".5" stop-color="#d4161b"/><stop offset="1" stop-color="#6e0709"/></radialGradient>
 <radialGradient id="blk" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#4a4a4e"/><stop offset=".5" stop-color="#1b1b1e"/><stop offset="1" stop-color="#050506"/></radialGradient>
 <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".8"/></filter>
 <!-- one hanging glove, cuff at top, thumb on the +x side -->
 <g id="glove" stroke="#000" stroke-width="4" stroke-linejoin="round">
  <path d="M-52,-160 Q0,-170 52,-160 Q60,-90 66,-20 L-66,-20 Q-60,-90 -52,-160z" fill="var(--cuff)"/>
  <path d="M-52,-160 Q0,-170 52,-160" fill="none" stroke="#777" stroke-width="5"/>
  <path d="M-70,-24 C-110,20 -112,120 -80,170 C-50,214 40,222 80,190 C118,158 116,70 98,10 C90,-10 78,-22 70,-24z" fill="var(--body)"/>
  <path d="M70,-14 C104,6 116,60 106,110 C100,140 82,150 66,140 C76,96 76,40 58,-4z" fill="var(--thumb)"/>
  <path d="M-80,40 C-84,100 -70,150 -40,176" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="10" stroke-linecap="round"/>
  <path d="M-66,-22 C-30,-30 30,-30 66,-22" fill="none" stroke="#000" stroke-opacity=".6" stroke-width="6"/>
  <path d="M-60,-150 L-56,-30" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="7" stroke-linecap="round"/>
 </g>
</defs>
<circle cx="500" cy="500" r="490" fill="url(#bg)"/>
<circle cx="500" cy="500" r="472" fill="none" stroke="url(#goldH)" stroke-width="26"/>
<circle cx="500" cy="500" r="448" fill="none" stroke="#c4161c" stroke-width="7"/>
<circle cx="500" cy="500" r="490" fill="none" stroke="#000" stroke-width="6"/>
<!-- side flares + stars -->
<g fill="url(#gold)" filter="url(#sh)">
 <path d="M70,520 L240,512 L240,528z"/><path d="M930,520 L760,512 L760,528z"/>
 <path id="star" d="M0,-26 L7.6,-8 L26,-8 L11,4 L16,24 L0,12 L-16,24 L-11,4 L-26,-8 L-7.6,-8z" transform="translate(268,520)"/>
 <use href="#star" transform="translate(464,0)"/>
</g>
<!-- laces to the hook -->
<g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round">
 <path d="M500,150 L400,440"/><path d="M500,150 L420,440"/><path d="M500,150 L586,455"/><path d="M500,150 L610,455"/>
</g>
<!-- gloves -->
<g filter="url(#sh)">
 <g transform="translate(412,600) rotate(7) scale(1.08)" style="--cuff:url(#red);--body:url(#blk);--thumb:url(#red)"><use href="#glove" transform="scale(-1,1)"/></g>
 <g transform="translate(600,615) rotate(-7) scale(1.08)" style="--cuff:url(#blk);--body:url(#red);--thumb:url(#red)"><use href="#glove"/></g>
</g>
<!-- lace stitching on the black cuff -->
<g stroke="#c4161c" stroke-width="5" fill="none"><path d="M594,470 l14,10 l14,-10 M594,495 l14,10 l14,-10 M594,520 l14,10 l14,-10"/></g>
<!-- wordmark -->
<g filter="url(#sh)">
 <text x="500" y="250" font-size="132" fill="url(#gold)" stroke="#3a2406" stroke-width="5" paint-order="stroke" letter-spacing="10">FIT</text>
 <path d="M150,270 Q500,236 850,270" fill="none" stroke="url(#gold)" stroke-width="7"/>
 <text x="500" y="420" font-size="168" textLength="880" lengthAdjust="spacingAndGlyphs" fill="url(#silver)" stroke="#b8862b" stroke-width="12" paint-order="stroke">FIGHTERS</text>
 <path d="M175,800 L825,800 L845,840 L825,880 L155,880 L175,840z" fill="#0b0b0c" stroke="url(#gold)" stroke-width="8" transform="translate(0,-12)"/>
 <text x="500" y="905" font-size="150" textLength="640" lengthAdjust="spacingAndGlyphs" fill="url(#silver)" stroke="#b8862b" stroke-width="11" paint-order="stroke">BOXING</text>
 <path d="M200,925 L800,925 L500,945z" fill="#c4161c"/>
</g>
</svg></body></html>
